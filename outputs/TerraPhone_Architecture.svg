<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="TerraPhone_Architecture-title TerraPhone_Architecture-desc" id="TerraPhone_Architecture-root"><title id="TerraPhone_Architecture-title">TerraPhone architecture</title><desc id="TerraPhone_Architecture-desc">Phone sensors feed a Swift app and the shared Rust autonomy core through UniFFI, with fleet supervision through Zenoh and a planned physical motor connection.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #TerraPhone_Architecture-root .diagram-container { width:100%;overflow-x:auto }
      #TerraPhone_Architecture-root .diagram-container { overflow-x:visible }</style><marker id="TerraPhone_Architecture-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#111"/></marker></defs><rect x="40" y="176" width="1200" height="348" fill="#f2f2f2" stroke="#111" stroke-width="1.5" /><text x="64" y="208" font-family="Arial" font-size="15" font-weight="700" fill="#111" text-anchor="start">ON THE PHONE</text><path d="M304 376 H372" fill="none" stroke="#111" stroke-width="1.6"  marker-end="url(#TerraPhone_Architecture-arrow)"/><path d="M556 376 H684" fill="none" stroke="#111" stroke-width="1.6"  marker-end="url(#TerraPhone_Architecture-arrow)"/><path d="M924 376 H1044" fill="none" stroke="#111" stroke-width="1.6"  marker-end="url(#TerraPhone_Architecture-arrow)"/><path d="M420 156 V240" fill="none" stroke="#111" stroke-width="1.6"  marker-end="url(#TerraPhone_Architecture-arrow)"/><path d="M500 240 V156" fill="none" stroke="#111" stroke-width="1.6"  marker-end="url(#TerraPhone_Architecture-arrow)"/><path d="M1092 464 V552" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#TerraPhone_Architecture-arrow)"/><rect x="574" y="332" width="92" height="26" fill="#f2f2f2" stroke="#111" stroke-width="1.5" /><text x="620" y="350" font-family="Arial" font-size="14" font-weight="700" fill="#111" text-anchor="middle">UNIFFI</text><rect x="950" y="332" width="76" height="26" fill="#f2f2f2" stroke="#111" stroke-width="1.5" /><text x="988" y="350" font-family="Arial" font-size="14" font-weight="700" fill="#111" text-anchor="middle">EFFORT</text><text x="580" y="112" font-family="Arial" font-size="14" font-weight="700" fill="#111" text-anchor="start">ZENOH</text><text x="580" y="140" font-family="Arial" font-size="18" font-weight="400" fill="#111" text-anchor="start">Goals / control</text><text x="580" y="166" font-family="Arial" font-size="18" font-weight="400" fill="#111" text-anchor="start">Status / telemetry</text><rect x="372" y="40" width="184" height="116" fill="#fff" stroke="#111" stroke-width="1.5" /><text x="392" y="78" font-family="Arial" font-size="28" font-weight="700" fill="#111" text-anchor="start">ARGOS</text><text x="392" y="108" font-family="Arial" font-size="18" font-weight="400" fill="#111" text-anchor="start">Fleet supervision</text><text x="392" y="136" font-family="Arial" font-size="17" font-weight="400" fill="#111" text-anchor="start">Goals + takeover</text><rect x="64" y="240" width="240" height="224" fill="#fff" stroke="#111" stroke-width="1.5" /><text x="88" y="280" font-family="Arial" font-size="26" font-weight="700" fill="#111" text-anchor="start">Phone sensors</text><text x="88" y="328" font-family="Arial" font-size="20" font-weight="400" fill="#111" text-anchor="start">ARKit camera + pose</text><text x="88" y="364" font-family="Arial" font-size="19" font-weight="400" fill="#111" text-anchor="start">Depth, where available</text><text x="88" y="400" font-family="Arial" font-size="20" font-weight="400" fill="#111" text-anchor="start">Core Motion IMU</text><text x="88" y="436" font-family="Arial" font-size="18" font-weight="400" fill="#111" text-anchor="start">Tracking + timestamps</text><rect x="372" y="240" width="184" height="224" fill="#fff" stroke="#111" stroke-width="1.5" /><text x="396" y="280" font-family="Arial" font-size="25" font-weight="700" fill="#111" text-anchor="start">TerraPhone</text><text x="396" y="312" font-family="Arial" font-size="20" font-weight="400" fill="#111" text-anchor="start">Swift app</text><text x="396" y="360" font-family="Arial" font-size="19" font-weight="400" fill="#111" text-anchor="start">Sensor access</text><text x="396" y="396" font-family="Arial" font-size="19" font-weight="400" fill="#111" text-anchor="start">Lifecycle + UI</text><text x="396" y="432" font-family="Arial" font-size="18" font-weight="400" fill="#111" text-anchor="start">Device adapters</text><rect x="684" y="240" width="240" height="224" fill="#111" stroke="#111" stroke-width="1.5" /><text x="708" y="280" font-family="Arial" font-size="25" font-weight="700" fill="#fff" text-anchor="start">Terra Rust Core</text><text x="708" y="328" font-family="Arial" font-size="20" font-weight="400" fill="#fff" text-anchor="start">State estimation</text><text x="708" y="364" font-family="Arial" font-size="18" font-weight="400" fill="#fff" text-anchor="start">Local occupancy map</text><text x="708" y="400" font-family="Arial" font-size="19" font-weight="400" fill="#fff" text-anchor="start">Authority + planning</text><text x="708" y="436" font-family="Arial" font-size="20" font-weight="400" fill="#fff" text-anchor="start">Velocity control</text><rect x="1044" y="240" width="172" height="224" fill="#fff" stroke="#111" stroke-width="1.5" /><text x="1064" y="280" font-family="Arial" font-size="22" font-weight="700" fill="#111" text-anchor="start">Motor output</text><text x="1064" y="328" font-family="Arial" font-size="19" font-weight="400" fill="#111" text-anchor="start">Left / right</text><text x="1064" y="358" font-family="Arial" font-size="19" font-weight="400" fill="#111" text-anchor="start">wheel effort</text><text x="1064" y="406" font-family="Arial" font-size="18" font-weight="400" fill="#111" text-anchor="start">App displays</text><text x="1064" y="434" font-family="Arial" font-size="18" font-weight="400" fill="#111" text-anchor="start">effort today</text><rect x="804" y="552" width="388" height="124" fill="#fff" stroke="#111" stroke-width="1.5" stroke-dasharray="6 5"/><text x="828" y="588" font-family="Arial" font-size="24" font-weight="700" fill="#111" text-anchor="start">Physical chassis</text><text x="828" y="624" font-family="Arial" font-size="20" font-weight="400" fill="#111" text-anchor="start">Planned phone-to-motor link</text><text x="828" y="654" font-family="Arial" font-size="18" font-weight="400" fill="#111" text-anchor="start">PWM adapter + hardware watchdog</text><text x="1108" y="546" font-family="Arial" font-size="14" font-weight="700" fill="#111" text-anchor="start">PLANNED</text><text x="64" y="584" font-family="Arial" font-size="21" font-weight="700" fill="#111" text-anchor="start">Same Rust algorithms run in the simulator.</text><text x="64" y="618" font-family="Arial" font-size="18" font-weight="400" fill="#111" text-anchor="start">Remote phone mode supervises the simulator over Zenoh.</text><text x="64" y="650" font-family="Arial" font-size="18" font-weight="400" fill="#111" text-anchor="start">It does not run a second onboard planner for that rover.</text></svg>
